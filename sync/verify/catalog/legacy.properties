# The current Hive tables, read-only, to compare with and backfill from
connector.name=hive
hive.security=read-only
hive.metastore=glue
hive.metastore.glue.region=${ENV:AWS_REGION}
hive.metastore.glue.skip-archive=true
fs.native-s3.enabled=true
s3.path-style-access=true
s3.endpoint=https://s3.${ENV:AWS_REGION}.amazonaws.com
