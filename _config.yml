remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme

minima:
  skin: auto
  # without this, the menu lists every page with a title, like the index
  nav_pages:
    - reports/overview/index.md
    - reports/contributing/index.md
    - reports/maintaining/index.md
    - reports/ci-cd/index.md
    - reports/tests/index.md
    - reports/community/index.md
    - reports/repositories/index.md
    - reports/hall-of-fame/index.md

exclude:
  - bin/
  - catalog/
  - sql/
  - sync/
  - vendor/
  - _site/
  - _sass/
