# The Hive tables written by trino-rest, read-only, mounted as the legacy catalog to backfill from.
# They are in another AWS account than the Iceberg tables, so this catalog uses that account's keys,
# instead of the credentials from the environment.
connector.name=hive
hive.security=read-only
hive.metastore=glue
hive.metastore.glue.region=${ENV:AWS_REGION}
hive.metastore.glue.aws-access-key=${ENV:LEGACY_AWS_ACCESS_KEY_ID}
hive.metastore.glue.aws-secret-key=${ENV:LEGACY_AWS_SECRET_ACCESS_KEY}
hive.metastore.glue.skip-archive=true
fs.native-s3.enabled=true
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.endpoint=https://s3.${ENV:AWS_REGION}.amazonaws.com
s3.aws-access-key=${ENV:LEGACY_AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:LEGACY_AWS_SECRET_ACCESS_KEY}
fs.cache.enabled=true
