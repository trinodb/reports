# The tables written by the sync, in data/ on the local disk, mounted as the trinocicd catalog by bin/run-trino.sh --local,
# so the sync and the reports can run unchanged without access to the S3 bucket. The file metastore is meant for tests,
# but it needs no other service.
connector.name=iceberg
iceberg.catalog.type=testing_file_metastore
iceberg.file-format=PARQUET
hive.metastore.catalog.dir=local:///metastore
fs.local.enabled=true
local.location=/data
