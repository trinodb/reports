# The OpenAPI connector with the Slack spec from sync/specs, mounted as the slack catalog
connector.name=openapi
spec-location=/etc/trino/specs/slack.json
base-uri=https://slack.com/api
authentication.type=http
authentication.scheme=bearer
authentication.bearer-token=${ENV:SLACK_API_TOKEN}
# users.list and conversations.list allow about 20 requests per minute
max-requests-per-second=0.3
# Slack asks to wait with Retry-After when a rate limit is exceeded, for up to a minute
retry-max-delay=2m
