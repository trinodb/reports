# The OpenAPI connector with the GitHub spec from sync/specs, mounted as the github catalog
connector.name=openapi
spec-location=/etc/trino/specs/github.json
base-uri=https://api.github.com
authentication.type=http
authentication.scheme=bearer
authentication.bearer-token=${ENV:GITHUB_TOKEN}
# GITHUB_TOKEN allows 15,000 requests per hour per repository, shared with other workflows,
# so the sync uses at most 7,200 of them, even when catching up for a whole hour
max-requests-per-second=2
# kept between runs with actions/cache, so unchanged responses are revalidated, which doesn't count against the rate limit
http-cache.directory=/opt/http-cache
