name: Incremental Slack sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # also used by other workflows writing to the Iceberg tables, so their commits don't conflict
  group: iceberg-writers
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Start Trino
        run: ./bin/run-trino.sh slack
      - name: Run Sync
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/slack
        run: |
          ./bin/sync.sh
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
