name: Incremental Slack sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # also used by other workflows writing to the Iceberg tables, so their commits don't conflict
  group: iceberg-writers
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
      TRINO_VERSION: 484
      TRINO_OPENAPI_VERSION: "2.2"
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Download trino-openapi
        run: |
          curl -fLOsS https://github.com/nineinchnick/trino-openapi/releases/download/v$TRINO_OPENAPI_VERSION/trino-openapi-$TRINO_OPENAPI_VERSION.zip
          unzip -q trino-openapi-$TRINO_OPENAPI_VERSION.zip
          curl -fLsS -o trino-jdbc.jar https://repo1.maven.org/maven2/io/trino/trino-jdbc/$TRINO_VERSION/trino-jdbc-$TRINO_VERSION.jar
      - name: Start Trino
        run: |
          cat <<EOF >config.properties
          coordinator=true
          node-scheduler.include-coordinator=true
          http-server.http.port=8080
          discovery.uri=http://localhost:8080
          query.max-memory-per-node=4086929818B
          cache-manager.config-files=etc/cache-manager-memory.properties,etc/cache-manager-alluxio.properties
          EOF
          mkdir -p $(pwd)/hive-cache && chmod go+w $(pwd)/hive-cache
          CONTAINER_ID=$(docker run \
            -v $(pwd)/config.properties:/etc/trino/config.properties \
            -v $(pwd)/etc/cache-manager-alluxio.properties:/etc/trino/cache-manager-alluxio.properties \
            -v $(pwd)/trino-openapi-$TRINO_OPENAPI_VERSION:/usr/lib/trino/plugin/openapi \
            -v $(pwd)/sync/specs/slack.json:/etc/trino/specs/slack.json \
            -v $(pwd)/catalog/slack.properties:/etc/trino/catalog/slack.properties \
            -v $(pwd)/catalog/trinocicd.properties:/etc/trino/catalog/trinocicd.properties \
            -v $(pwd)/hive-cache:/opt/hive-cache \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e SLACK_API_TOKEN \
            -p 8080:8080 \
            --name trino \
            -d \
            trinodb/trino:$TRINO_VERSION)
          i=0
          until docker inspect "${CONTAINER_ID}" --format "{{json .State.Health.Status }}" | grep -q '"healthy"'; do
              if [[ $((i++)) -ge 10 ]]; then
                  echo "🚨 Too many retries waiting for Trino to start"
                  exit 1
              fi
              sleep 10
          done
      - name: Run Sync
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/slack
        run: |
          java -cp trino-jdbc.jar sync/Sync.java
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
