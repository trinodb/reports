name: Incremental GitHub sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 */2 * * *'

concurrency:
  # also used by other workflows writing to the Iceberg tables, so their commits don't conflict
  group: iceberg-writers
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Show the rate limit
        run: |
          curl -fsS -o /dev/null -D - -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/rate_limit | grep -i '^x-ratelimit-'
      - name: Restore the HTTP cache
        uses: actions/cache/restore@v6
        with:
          path: http-cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Start Trino
        run: |
          # the connector reads only files owned by the user running Trino, which has the ID 1000 in the image
          mkdir -p http-cache && sudo chown -R 1000:1000 http-cache
          ./bin/run-trino.sh github
      - name: Run Sync
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/github
          # the steps reading issues, pull requests, and their comments and reviews read the repository given here
          SYNC_OWNER: trinodb
          SYNC_REPO: trino
          # revalidate cached responses, so children aren't read from a response cached before their parent changed
          SYNC_SESSION_PROPERTIES: github.http_cache_enabled:false
        run: |
          ./bin/sync.sh
      - name: Sync other repositories
        if: ${{ !cancelled() }}
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/github
          SYNC_STEPS: issues,issue_comments,pulls,reviews
          SYNC_SESSION_PROPERTIES: github.http_cache_enabled:false
          SYNC_OWNER: trinodb
          # clients and tools, reported on their own page; their CI and commits aren't read
          REPOSITORIES: trino-gateway trino-python-client trino-go-client trino-js-client trino-csharp-client trino-query-ui grafana-trino charts
        run: |
          failed=0
          for repo in $REPOSITORIES; do
              SYNC_REPO=$repo ./bin/sync.sh || failed=1
          done
          exit $failed
      - name: Compact tables written in batches
        if: ${{ !cancelled() }}
        run: |
          docker exec -i trino trino --catalog trinocicd --schema github -f /dev/stdin <sync/maintenance/compact-github.sql
      - name: Show the rate limit
        if: always()
        run: |
          curl -fsS -o /dev/null -D - -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/rate_limit | grep -i '^x-ratelimit-'
      - name: Save the HTTP cache
        if: always()
        run: |
          # the connector creates files only the user running Trino can read
          sudo chown -R "$(id -u):$(id -g)" http-cache
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: http-cache
          key: http-cache-${{ github.run_id }}
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
