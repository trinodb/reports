name: Reports

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Start Trino
        run: ./bin/run-trino.sh git
      - name: Execute queries
        run: ./bin/reports.sh
      - name: Commit report
        run: |
          # pull in case someone pushed commits during reports generation, which can take a while
          # if there are conflicts, this will fail
          git pull --ff-only
          git config user.name 'GitHub Automation'
          git config user.email ''
          git add --all reports/
          git commit -m "Automated report"
          git push
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
