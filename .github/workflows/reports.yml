name: Reports

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TRINO_VERSION: 484
      TRINO_GIT_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - name: Install dependencies
        run: |
          sudo apt update
          sudo pip install ansi2html
          curl -fLOsS https://github.com/nineinchnick/trino-git/releases/download/v$TRINO_GIT_VERSION/trino-git-$TRINO_GIT_VERSION.zip
          unzip trino-git-$TRINO_GIT_VERSION.zip
      - name: Start Trino
        run: |
          mkdir -p $(pwd)/hive-cache && chmod go+w $(pwd)/hive-cache
          CONTAINER_ID=$(docker run \
            -v $(pwd)/etc/config.properties:/etc/trino/config.properties \
            -v $(pwd)/etc/cache-manager-alluxio.properties:/etc/trino/cache-manager-alluxio.properties \
            -v $(pwd)/trino-git-$TRINO_GIT_VERSION:/usr/lib/trino/plugin/git \
            -v $(pwd)/catalog/git.properties:/etc/trino/catalog/git.properties \
            -v $(pwd)/catalog/trinocicd.properties:/etc/trino/catalog/trinocicd.properties \
            -v $(pwd)/hive-cache:/opt/hive-cache \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -p 8080:8080 \
            --name trino \
            -d \
            trinodb/trino:$TRINO_VERSION)
          SERVER_IP=$(docker inspect --format '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
          echo "SERVER_IP=$SERVER_IP" >> $GITHUB_ENV
          i=0
          until docker inspect "${CONTAINER_ID}" --format "{{json .State.Health.Status }}" | grep -q '"healthy"'; do
              if [[ $((i++)) -ge 10 ]]; then
                  echo "🚨 Too many retries waiting for Trino to start"
                  exit 1
              fi
              sleep 10
          done
      - name: Execute queries
        run: |
          # builds the tables and functions that the reports share, in the memory catalog
          ./bin/reports.sh "$RUNNER_TEMP/setup.md" "Setup" sql/setup/*.sql
          ./bin/reports.sh reports/overview/index.md "Trino Overview" sql/overview/*.sql
          ./bin/reports.sh reports/contributing/index.md "Contributing to Trino" sql/contributing/*.sql
          ./bin/reports.sh reports/maintaining/index.md "Maintaining Trino" sql/maintaining/*.sql
          ./bin/reports.sh reports/ci-cd/index.md "Trino CI/CD Reports" sql/ci-cd/{health,success-ratio-per-day,runs-queue-time-per-day,runs-duration-per-day,runs-job-cumulative-duration-per-day,jobs-duration}.sql
          ./bin/reports.sh reports/tests/index.md "Trino Tests Reports" sql/tests/{jobs,annotations}.sql
          ./bin/reports.sh reports/pr/index.md "Trino PR Reports" sql/pr/{burndown,authors-per-month,changes-per-month,prs-per-author,reviewers-per-pr,reviews-per-author-assoc,top-reviewers,top-authors,top-mergers,sith-lords,mergers-authors,reviewers-top-authors,time-to-merge,time-to-merge-per-size,avg-time-to-merge,time-to-first-review,avg-time-to-first-review,reviewer-responsiveness,author-responsiveness,open-pr-age,awaiting-review,inactivity-on-prs,abandoned-prs,running-prs,stale-prs}.sql
          ./bin/reports.sh reports/hall-of-fame/index.md "Trino Hall of Fame" sql/hall-of-fame/*.sql
      - name: Commit report
        run: |
          # pull in case someone pushed commits during reports generation, which can take a while
          # if there are conflicts, this will fail
          git pull --ff-only
          git config user.name 'GitHub Automation'
          git config user.email ''
          git add --all reports/
          git commit -m "Automated report"
          git push
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
