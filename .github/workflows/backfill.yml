name: Backfill the new tables from the old ones

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Which tables to copy"
        type: choice
        options:
          - github
          - slack
        default: github
      cutoff:
        description: "Copy only GitHub rows from before this time, like 2026-10-29 00:00:00; all rows when empty"
        required: false
        default: ""

concurrency:
  group: iceberg-writers
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      # the old tables are in another AWS account, read with its keys by the legacy and legacyslack catalogs
      LEGACY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      LEGACY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TRINO_VERSION: 484
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Download the Trino JDBC driver
        run: |
          curl -fLsS -o trino-jdbc.jar https://repo1.maven.org/maven2/io/trino/trino-jdbc/$TRINO_VERSION/trino-jdbc-$TRINO_VERSION.jar
      - name: Start Trino
        run: |
          cat <<EOF >config.properties
          coordinator=true
          node-scheduler.include-coordinator=true
          http-server.http.port=8080
          discovery.uri=http://localhost:8080
          query.max-memory-per-node=4086929818B
          cache-manager.config-files=etc/cache-manager-memory.properties,etc/cache-manager-alluxio.properties
          EOF
          mkdir -p $(pwd)/hive-cache && chmod go+w $(pwd)/hive-cache
          CONTAINER_ID=$(docker run \
            -v $(pwd)/config.properties:/etc/trino/config.properties \
            -v $(pwd)/etc/cache-manager-alluxio.properties:/etc/trino/cache-manager-alluxio.properties \
            -v $(pwd)/catalog/trinocicd-iceberg.properties:/etc/trino/catalog/trinocicd.properties \
            -v $(pwd)/catalog/legacy.properties:/etc/trino/catalog/legacy.properties \
            -v $(pwd)/catalog/legacyslack.properties:/etc/trino/catalog/legacyslack.properties \
            -v $(pwd)/hive-cache:/opt/hive-cache \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e LEGACY_AWS_ACCESS_KEY_ID \
            -e LEGACY_AWS_SECRET_ACCESS_KEY \
            -p 8080:8080 \
            --name trino \
            -d \
            trinodb/trino:$TRINO_VERSION)
          i=0
          until docker inspect "${CONTAINER_ID}" --format "{{json .State.Health.Status }}" | grep -q '"healthy"'; do
              if [[ $((i++)) -ge 10 ]]; then
                  echo "🚨 Too many retries waiting for Trino to start"
                  exit 1
              fi
              sleep 10
          done
      - name: Create the schema
        if: inputs.data == 'github'
        run: |
          docker exec trino trino --execute "CREATE SCHEMA IF NOT EXISTS trinocicd.github WITH (location = 's3://trino-reports-jwas/github')"
      - name: Create tables
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/${{ inputs.data }}
          SYNC_STEPS: tables
        run: |
          java -cp trino-jdbc.jar sync/Sync.java
      - name: Backfill GitHub
        if: inputs.data == 'github'
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/backfill
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          if [ -n "$CUTOFF" ]; then
              export SYNC_CUTOFF="$CUTOFF"
          fi
          java -cp trino-jdbc.jar sync/Sync.java
      - name: Backfill Slack
        if: inputs.data == 'slack'
        env:
          SYNC_TRINO_URL: jdbc:trino://localhost:8080
          SYNC_STEPS_DIR: sync/backfill-slack
        run: |
          java -cp trino-jdbc.jar sync/Sync.java
      - name: Compare row counts of GitHub tables
        if: inputs.data == 'github'
        run: |
          docker exec trino trino --output-format=ALIGNED --execute "
            SELECT 'runs' AS \"table\", (SELECT count(*) FROM legacy.v2.runs WHERE owner = 'trinodb' AND repo = 'trino') AS old_rows, (SELECT count(*) FROM trinocicd.github.runs) AS new_rows
            UNION ALL SELECT 'jobs', (SELECT count(DISTINCT id) FROM legacy.v2.jobs WHERE owner = 'trinodb' AND repo = 'trino'), (SELECT count(*) FROM trinocicd.github.jobs)
            UNION ALL SELECT 'pulls', (SELECT count(DISTINCT id) FROM legacy.v2.pulls WHERE owner = 'trinodb' AND repo = 'trino'), (SELECT count(*) FROM trinocicd.github.pulls)
            UNION ALL SELECT 'issues', (SELECT count(DISTINCT id) FROM legacy.v2.issues WHERE owner = 'trinodb' AND repo = 'trino'), (SELECT count(*) FROM trinocicd.github.issues)
            UNION ALL SELECT 'check_runs', (SELECT count(DISTINCT id) FROM legacy.v2.check_runs WHERE owner = 'trinodb' AND repo = 'trino'), (SELECT count(*) FROM trinocicd.github.check_runs)"
      - name: Compare row counts of Slack tables
        if: inputs.data == 'slack'
        run: |
          docker exec trino trino --output-format=ALIGNED --execute "
            SELECT 'messages' AS \"table\", (SELECT count(DISTINCT (channel, ts)) FROM legacyslack.slack.messages) AS old_rows, (SELECT count(*) FROM trinocicd.slack.messages) AS new_rows
            UNION ALL SELECT 'replies', (SELECT count(DISTINCT (channel, ts)) FROM legacyslack.slack.replies), (SELECT count(*) FROM trinocicd.slack.replies)
            UNION ALL SELECT 'users', (SELECT count(DISTINCT id) FROM legacyslack.slack.users), (SELECT count(DISTINCT id) FROM trinocicd.slack.users)
            UNION ALL SELECT 'channels', (SELECT count(DISTINCT id) FROM legacyslack.slack.channels), (SELECT count(DISTINCT id) FROM trinocicd.slack.channels)
            UNION ALL SELECT 'channel_members', (SELECT count(DISTINCT (channel, member)) FROM legacyslack.slack.channel_members), (SELECT count(DISTINCT (channel, member)) FROM trinocicd.slack.channel_members)"
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
