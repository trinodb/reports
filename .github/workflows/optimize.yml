name: Optimize

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 1 * * *'

concurrency:
  group: iceberg-writers
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::428825817873:role/trino-reports-github
          aws-region: eu-central-1
          # Trino reads the credentials only when it starts, so they have to last as long as the job
          role-duration-seconds: 21600
      - name: Start Trino
        run: ./bin/run-trino.sh
      - name: Optimize GitHub tables
        run: |
          docker exec -i trino trino --catalog trinocicd --schema github -f /dev/stdin <sync/maintenance/optimize-github.sql
      - name: Optimize Slack tables
        run: |
          docker exec -i trino trino --catalog trinocicd --schema slack -f /dev/stdin <sync/maintenance/optimize-slack.sql
      - name: Dump Trino logs
        if: always()
        run: |
          docker logs trino
